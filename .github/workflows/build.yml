
name: Build Noor Android

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Inspect Flutter plugins
        run: |
          flutter --version
          flutter pub deps --style=compact
          cat .flutter-plugins-dependencies
          grep -RniE 'PluginRegistry\.Registrar|io\.flutter\.app' "$HOME/.pub-cache/hosted/pub.dev" || true

      - name: Build APK
        run: flutter build apk --release -v



