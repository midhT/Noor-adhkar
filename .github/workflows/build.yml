name: Build Noor Android

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: noor-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Validate and build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show toolchain versions
        run: |
          java -version
          flutter --version
          flutter doctor -v

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze Dart source
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Configure Flutter SDK path for Gradle
        shell: bash
        run: |
          FLUTTER_BIN="$(readlink -f "$(command -v flutter)")"
          FLUTTER_SDK="$(dirname "$(dirname "$FLUTTER_BIN")")"
          test -f "$FLUTTER_SDK/packages/flutter_tools/gradle/build.gradle"
          printf 'flutter.sdk=%s\n' "$FLUTTER_SDK" > android/local.properties

      - name: Set up Gradle 8.14.3
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Generate and verify Gradle wrapper
        working-directory: android
        run: |
          gradle wrapper --gradle-version 8.14.3 --distribution-type all
          chmod +x gradlew
          ./gradlew --version

      - name: Build release APK
        run: flutter build apk --release --verbose

      - name: Verify APK
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          ls -lh "$APK"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: Noor-4.0-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
