name: Build Noor Android

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Configure Flutter SDK path
        shell: bash
        run: |
          FLUTTER_BIN=$(readlink -f "$(command -v flutter)")
          FLUTTER_SDK=$(dirname "$(dirname "$FLUTTER_BIN")")
          echo "flutter.sdk=$FLUTTER_SDK" > android/local.properties

      - name: Setup Gradle 8.14.3
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Generate Gradle wrapper
        working-directory: android
        run: |
          gradle wrapper --gradle-version 8.14.3 --distribution-type all
          chmod +x gradlew
          ./gradlew --version

      - name: Build release APK (verbose diagnostics)
        run: flutter build apk --release --verbose

      - name: Verify release APK
        run: test -s build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Noor-4.0-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
