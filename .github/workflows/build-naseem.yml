name: Build Naseem APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Install native Android widgets and manifest
        run: node scripts/patch-android.mjs

      - name: Generate Naseem icons and splash
        run: npx --yes @capacitor/assets generate --android

      - name: Apply themed icon layer
        run: node scripts/patch-icons.mjs

      - name: Sync Android
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Naseem-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
