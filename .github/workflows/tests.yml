name: Naseem verification and Android debug build
on:
  pull_request:
  push:
    branches: [main, 'naseem-*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install Node dependencies
        run: npm install --no-audit --no-fund
      - name: Build web bundle
        run: npm run build
      - name: Install Chromium test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Run full source and browser verification suite
        run: bash tests/run.sh
      - name: Check JavaScript syntax and whitespace
        run: |
          for f in www/*.js scripts/*.mjs tests/*.js tests/*.mjs; do node --check "$f"; done
          git diff --check
      - name: Generate Android project
        run: |
          npx cap add android
          npx --yes --package=@capacitor/assets capacitor-assets generate --android
          node scripts/patch-icons.mjs
          node scripts/patch-android.mjs
      - name: Compile native Android debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Naseem-v4.0.8-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
