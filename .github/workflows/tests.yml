name: Naseem verification and Android debug build
on:
  pull_request:
  push:
    branches: [main, 'naseem-*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install Node dependencies
        env:
          npm_config_fetch_retries: 5
          npm_config_fetch_retry_mintimeout: 20000
          npm_config_fetch_retry_maxtimeout: 120000
          npm_config_fetch_timeout: 300000
        run: npm install --no-audit --no-fund --prefer-online
      - name: Build web bundle
        run: npm run build
      - name: Install Chromium test dependencies
        run: |
          python -m pip install --disable-pip-version-check --retries 5 --timeout 120 playwright
          python -m playwright install --with-deps chromium
      - name: Run full source and browser verification suite
        run: bash tests/run.sh
      - name: Check JavaScript syntax and whitespace
        run: |
          for f in www/*.js scripts/*.mjs tests/*.js tests/*.mjs; do node --check "$f"; done
          git diff --check
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android SDK components
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
      - name: Generate Android project
        run: |
          npx cap add android
          npx --yes --package=@capacitor/assets capacitor-assets generate --android
          node scripts/patch-icons.mjs
          node scripts/patch-android.mjs
      - name: Compile native Android debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Naseem-v4.0.9-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
