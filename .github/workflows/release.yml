name: Build and publish Naseem release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v4
      - name: Read release version
        id: meta
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package version v$VERSION" >&2
            exit 1
          fi
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build web app
        run: npm run build
      - name: Add Android platform
        run: npx cap add android
      - name: Generate app icons and splash
        run: npx --yes --package=@capacitor/assets capacitor-assets generate --android
      - name: Apply themed icon layer
        run: node scripts/patch-icons.mjs
      - name: Integrate native Android widgets and back handling
        run: node scripts/patch-android.mjs
      - name: Prepare protected release signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.NASEEM_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Missing GitHub Actions secret: NASEEM_KEYSTORE_BASE64" >&2; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/naseem-release.keystore"
          test -s "$RUNNER_TEMP/naseem-release.keystore"
      - name: Configure release signing
        env:
          NASEEM_KEYSTORE: ${{ runner.temp }}/naseem-release.keystore
          NASEEM_STORE_PASSWORD: ${{ secrets.NASEEM_STORE_PASSWORD }}
          NASEEM_KEY_ALIAS: ${{ secrets.NASEEM_KEY_ALIAS }}
          NASEEM_KEY_PASSWORD: ${{ secrets.NASEEM_KEY_PASSWORD }}
        run: node scripts/apply-signing.mjs
      - name: Build signed release APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleRelease
      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Naseem-v${{ steps.meta.outputs.version }}-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.meta.outputs.version }}
          name: Naseem v${{ steps.meta.outputs.version }}
          generate_release_notes: true
          files: android/app/build/outputs/apk/release/app-release.apk
