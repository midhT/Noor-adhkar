name: Build Naseem APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - naseem-v4.0.1

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Build native bridge
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Patch Android native components
        run: node scripts/patch-android.mjs

      - name: Generate launcher assets
        run: npx --yes @capacitor/assets generate --android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Upload Naseem APK
        uses: actions/upload-artifact@v4
        with:
          name: Naseem-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
