name: Build Naseem debug APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build web app
        run: npm run build
      - name: Add Android platform
        run: npx cap add android
      - name: Generate app icons and splash
        run: npx --yes --package=@capacitor/assets capacitor-assets generate --android
      - name: Apply themed icon layer
        run: node scripts/patch-icons.mjs
      - name: Integrate native Android widgets and back handling
        run: node scripts/patch-android.mjs
      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Naseem-${{ github.sha }}-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
