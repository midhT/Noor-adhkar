name: Build Noor APK

on:
  workflow_dispatch:
  push:
    branches: [ noor-v3.2-builder ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-ubuntu-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Build native bridge
        run: npm run build

      - name: Add Android platform if missing or incomplete
        run: |
          if [ ! -f capacitor.config.json ] || [ ! -f android/app/src/main/AndroidManifest.xml ]; then
            echo "Capacitor Android platform missing or incomplete; creating it now..."
            npx cap add android
          else
            echo "Capacitor Android platform already initialized; skipping creation."
          fi

      - name: Add Noor widgets, alarm permissions and native plugin
        run: node scripts/patch-android.mjs

      - name: Generate launcher icon and splash assets
        run: npx --yes @capacitor/assets generate --android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Noor-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
