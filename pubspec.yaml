name: noor
description: Noor - an offline-first Islamic daily companion.
publish_to: "none"
version: 5.0.0+5

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  adhan: ^2.0.0
  geolocator: ^13.0.2
  shared_preferences: ^2.3.3
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0
  home_widget: ^0.7.0
  intl: ^0.19.0
  audioplayers: ^6.1.0
  file_picker: ^8.1.2
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/audio/night_pad.wav
